    <!-- =====================================================================
         Critical CSS — Splash screen (Apple-style, แสดงก่อน React โหลดเสร็จ)
         ===================================================================== -->
    <style>
      :root {
        --bg: #f5f5f7;
        --fg: #1d1d1f;
        --muted: #6e6e73;
        --accent: #0071e3;
        --track: rgba(0, 0, 0, 0.12);
        --font: "Inter", "Noto Sans Thai", -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --fg: #f5f5f7;
          --muted: #a1a1a6;
          --accent: #2997ff;
          --track: rgba(255, 255, 255, 0.16);
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      .splash {
        min-height: 100vh;
        min-height: calc(
          100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)
        );
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        text-align: center;
      }
      .splash__spinner {
        width: 36px;
        height: 36px;
        animation: splash-spin 0.9s linear infinite;
      }
      .splash__spinner circle {
        fill: none;
        stroke-width: 4;
      }
      .splash__track {
        stroke: var(--track);
      }
      .splash__arc {
        stroke: var(--accent);
        stroke-linecap: round;
        stroke-dasharray: 31.4 125.6;
      }
      .splash__text {
        margin: 0;
        font-size: 15px;
        line-height: 1.5;
        color: var(--muted);
      }
      .splash__retry {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 11px 24px;
        background: #0071e3;
        color: #ffffff;
        font: 500 15px/1 var(--font);
        cursor: pointer;
      }
      .splash__retry[hidden] {
        display: none;
      }
      .splash__retry:focus-visible {
        outline: 4px solid rgba(0, 113, 227, 0.35);
        outline-offset: 2px;
      }

      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash__spinner {
          animation: none;
        }
      }
    </style>
    <noscript>

    <div id="root">
      <div class="splash" role="status" aria-live="polite">
        <svg class="splash__spinner" viewBox="0 0 50 50" aria-hidden="true">
          <circle class="splash__track" cx="25" cy="25" r="20" />
          <circle class="splash__arc" cx="25" cy="25" r="20" />
        </svg>
        <p class="splash__text">กำลังโหลด…</p>
        <button
          type="button"
          class="splash__retry"
          hidden
          onclick="location.reload()"
        >
          โหลดใหม่
        </button>
      </div>
    </div>

    <script type="module" src="/src/main.jsx" fetchpriority="high"></script>

    <!-- ถ้าแอปโหลดนานผิดปกติ หรือไฟล์ JS โหลดไม่สำเร็จ ให้ผู้ใช้กดโหลดใหม่ได้ -->
    <script>
      (function () {
        function showRetry(message) {
          var splash = document.querySelector("#root .splash");
          if (!splash) return; // React เรนเดอร์แล้ว ไม่ต้องทำอะไร
          var text = splash.querySelector(".splash__text");
          var button = splash.querySelector(".splash__retry");
          if (text) text.textContent = message;
          if (button) button.hidden = false;
        }

        setTimeout(function () {
          showRetry("โหลดนานกว่าปกติ ลองโหลดหน้าใหม่อีกครั้ง");
        }, 12000);

        var entry = document.querySelector('script[type="module"]');
        if (entry) {
          entry.addEventListener("error", function () {
            showRetry("โหลดแอปไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่");
          });
        }
      })();
    </script>

    <!-- Service Worker (เฉพาะ production บน HTTPS) -->
    <script>
      if (
        "serviceWorker" in navigator &&
        location.protocol === "https:" &&
        location.hostname !== "localhost"
      ) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register("/sw.js", { scope: "/" })
            .catch(function (err) {
              console.warn("Service Worker registration failed:", err);
            });
        });
      }
    </script>
